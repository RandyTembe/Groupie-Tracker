<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte des artistes</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/CSS/map.css">
</head>
<body>
    <div class="layout">
        <aside>
            <h1>Carte des artistes</h1>
            <p>Chaque point correspond à un lieu de concert issu de l'API. Cliquez sur la carte pour voir le nom de l'artiste et le lieu.</p>
            <div class="toolbar">
                <button class="btn" id="btnFit">Recentrer</button>
                <button class="btn" id="btnReload">Recharger</button>
            </div>
            <div id="artistList">Chargement...</div>
        </aside>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/map.js"></script>
</body>
</html>
